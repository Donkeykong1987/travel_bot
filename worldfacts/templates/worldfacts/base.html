<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Worldfacts{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .hero-img { max-height: 400px; object-fit: cover; width: 100%; border-radius: 12px; }
        .card-custom { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'explore' %}">
                <i class="bi bi-compass-fill me-2 text-warning"></i>Worldfacts
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'explore' %}"><i class="bi bi-search me-1"></i> Szukaj miejsca</a>
                    </li>
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'favorites_list' %}"><i class="bi bi-star-fill text-warning me-1"></i> Ulubione</a>
                        </li>
                        <li class="nav-item ms-lg-2">
                            <span class="navbar-text me-2"><i class="bi bi-person-circle me-1"></i>{{ user.username }}</span>
                        </li>
                        <li class="nav-item">
                            <form action="{% url 'logout' %}" method="POST" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Wyloguj</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item ms-lg-2">
                            <a class="btn btn-outline-light btn-sm me-2" href="{% url 'login' %}">Zaloguj się</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-warning btn-sm fw-bold" href="{% url 'register' %}">Zarejestruj się</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        <!-- Tutaj wstrzykiwana jest zawartość innych stron -->
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white text-center py-3 border-top mt-auto">
        <small class="text-muted">Worldfacts App &copy; 2026 — Zasilane przez Wikipedia API</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
